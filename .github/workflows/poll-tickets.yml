name: Poll SoftCS tickets

# A SoftCS não expõe webhook de ticket (ver api/webhook.js), então quem
# detecta ticket novo/movido/resolvido é /api/poll-tickets — uma
# sincronização completa da conta numa chamada só (POST /tickets/search,
# ver lib/ticket-sync.js).
#
# Não roda no `schedule:` do próprio GitHub Actions — medido ao vivo por 2
# dias, e o agendador do GitHub atrasa crons curtos pra uma média real de
# ~55-70min entre execuções, inviável pra notificação em tempo hábil. Quem
# dispara isso periodicamente é um cron externo (cron-job.org) chamando o
# endpoint direto. `workflow_dispatch` continua aqui só pro disparo imediato
# ao reconectar (lib/github-actions.js).
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar tickets
        env:
          POLL_URL: https://softcs-bot.vercel.app/api/poll-tickets
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          http_code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$POLL_URL")
          echo "HTTP $http_code:"
          cat /tmp/resp.json
          echo

          # Sem isso o job aparecia "sucesso" (verde) mesmo quando a chamada
          # de dentro falhava (ex: token expirado) — o curl em si não falha,
          # só o servidor responde com erro.
          if [ "$http_code" != "200" ]; then
            echo "Erro (HTTP $http_code) — marcando esse run como falho."
            exit 1
          fi
