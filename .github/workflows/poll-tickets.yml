name: Poll SoftCS tickets

# A SoftCS não expõe webhook de ticket (ver api/webhook.js), então quem
# detecta ticket novo/movido é essa varredura periódica, chamando
# /api/poll-tickets. Roda por aqui (não como Cron Job da própria Vercel)
# porque o plano Hobby da Vercel só permite cron 1x/dia — GitHub Actions
# permite a cada 15min de graça.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Reconfirmar tickets já conhecidos primeiro
        env:
          POLL_URL: https://softcs-bot.vercel.app/api/poll-tickets
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          # Fase rápida e sempre completa (poucos clientes, um por ticket já
          # em ticket_state) — garante que a movimentação de tickets já
          # conhecidos é detectada todo ciclo, mesmo que a fase de descoberta
          # abaixo não termine a tempo do token expirar.
          http_code=$(curl -s -o /tmp/known.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$POLL_URL?phase=known")
          echo "HTTP $http_code:"
          cat /tmp/known.json
          echo

      - name: Descobrir tickets novos em lotes até acabar a conta
        env:
          POLL_URL: https://softcs-bot.vercel.app/api/poll-tickets
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          # Sem ?offset= aqui de propósito: o servidor retoma sozinho de onde
          # a última chamada parou (cursor salvo em `settings`), então essa
          # execução continua o progresso mesmo se a anterior tiver morrido
          # no meio (ex: token expirado) — não reescaneia do zero toda vez.
          while true; do
            http_code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$POLL_URL")
            echo "HTTP $http_code:"
            cat /tmp/resp.json
            echo

            if [ "$http_code" = "429" ]; then
              retry=$(jq -r '.retryAfterSeconds // 60' /tmp/resp.json)
              echo "Rate limited pela SoftCS, aguardando ${retry}s..."
              sleep "$retry"
              continue
            fi

            if [ "$http_code" != "200" ]; then
              echo "Erro inesperado (HTTP $http_code), abortando essa rodada — a próxima execução retoma daqui."
              exit 1
            fi

            hasMore=$(jq -r '.hasMoreClients' /tmp/resp.json)
            if [ "$hasMore" != "true" ]; then
              echo "Volta completa pela conta."
              break
            fi
          done
