name: Reconfirm known SoftCS tickets

# Reconfirma a fase "known" (só os clientes donos de tickets que já estão em
# ticket_state — ver api/poll-tickets.js), separado do workflow de descoberta
# completa (poll-tickets.yml).
#
# Não roda mais no `schedule:` do próprio GitHub Actions — medido ao vivo por
# 2 dias, e o agendador do GitHub atrasa esse cron de "*/5" pra uma média
# real de ~55-70min entre execuções (throttling do lado deles pra workflows
# agendados, sem relação com o valor configurado; nem chega perto dos 5min
# pedidos), inviável pra notificação em tempo hábil. Quem dispara isso
# periodicamente agora é um cron externo (cron-job.org, roda no intervalo
# configurado de verdade) chamando o endpoint direto — ver README, seção
# "Detecção via polling". `workflow_dispatch` continua aqui só pro disparo
# imediato ao reconectar (lib/github-actions.js).
on:
  workflow_dispatch: {}

jobs:
  poll-known:
    runs-on: ubuntu-latest
    steps:
      - name: Reconfirmar tickets já conhecidos
        env:
          POLL_URL: https://softcs-bot.vercel.app/api/poll-tickets
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          http_code=$(curl -s -o /tmp/known.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$POLL_URL?phase=known")
          echo "HTTP $http_code:"
          cat /tmp/known.json
          echo

          # Sem isso o job aparecia "sucesso" (verde) mesmo quando a chamada
          # de dentro falhava (ex: token expirado) — o curl em si não falha,
          # só o servidor responde com erro, e sem checar o código o bash
          # não tinha motivo pra sair com status != 0.
          if [ "$http_code" != "200" ]; then
            echo "Erro (HTTP $http_code) — marcando esse run como falho."
            exit 1
          fi
