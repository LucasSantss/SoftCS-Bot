<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SoftCS Bot — Entrar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="admin.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: 100%; max-width: 360px; text-align: center; }
  .login-brand { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 1.5rem; }
  .login-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; }
  .login-error { margin-bottom: 1rem; }
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    width: 100%; padding: 0.75rem 1rem; border-radius: 0.6rem;
    background: #fff; color: #1f1f1f; font-weight: 600; font-size: 0.9rem;
    text-decoration: none;
  }
  .google-btn:hover { filter: brightness(0.96); }
</style>
</head>
<body>

  <div class="card login-card">
    <div class="login-brand">
      <div class="brand-icon">S</div>
      <div class="login-title">SoftCS Bot</div>
    </div>
    <p class="muted" id="loginError" style="display:none"></p>
    <a class="google-btn" href="/api/auth-start">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.8 2.73v2.27h2.92c1.71-1.57 2.68-3.88 2.68-6.64z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.96H.96A8.99 8.99 0 000 9c0 1.45.35 2.83.96 4.04l3.01-2.34z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Entrar com Google
    </a>
    <p class="muted" style="margin-top: 1rem;">Só contas @chatbotmaker.io autorizadas pelo administrador.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    if (error) {
      const messages = {
        domain: "Acesso negado: use uma conta @chatbotmaker.io.",
        not_allowed: "Esse e-mail ainda não foi liberado no painel. Peça pro administrador te adicionar na aba Acesso.",
        access_denied: "Login cancelado.",
      };
      const el = document.getElementById("loginError");
      el.textContent = messages[error] || "Não foi possível entrar.";
      el.style.display = "block";
      el.style.color = "var(--destructive)";
    }
  </script>
</body>
</html>
